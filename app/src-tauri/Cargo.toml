[package]
name = "entry-desktop"
version = "1.1.0"
edition = "2021"
description = "Entry Desktop — local agent runtime paired with your Entry account"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
name = "entry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
