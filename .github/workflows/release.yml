name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0-beta.1)"
        required: true
  push:
    tags:
      - "v*"
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Tauri 2 (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    # linuxdeploy AppImage bundling needs this on GitHub runners (FUSE-less)
    env:
      NO_STRIP: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "macos-latest"
          - platform: "ubuntu-22.04"
          - platform: "windows-latest"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: dtolnay/rust-toolchain@stable
      - uses: oven-sh/setup-bun@v2
      - name: Linux build deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - name: Build sidecar binary
        shell: bash
        run: |
          pnpm install
          (cd sidecar && pnpm build)
          case "${{ matrix.platform }}" in
            macos-latest)   TRIPLE="aarch64-apple-darwin";  EXT="" ;;
            ubuntu-22.04)   TRIPLE="x86_64-unknown-linux-gnu"; EXT="" ;;
            windows-latest) TRIPLE="x86_64-pc-windows-msvc";   EXT=".exe" ;;
          esac
          mkdir -p app/src-tauri/binaries
          (cd sidecar && bun build ./dist/index.cjs --compile --outfile "../app/src-tauri/binaries/agent-sidecar-$TRIPLE$EXT")
      - name: Build Tauri app & upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Entry Desktop ${{ inputs.tag || github.ref_name }}"
          releaseBody: "Entry Desktop pre-release — local agent runtime, paired with your Entry account."
          releaseDraft: false
          prerelease: true
          projectPath: "app"
