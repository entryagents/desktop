name: Desktop CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: pnpm install
      - run: pnpm -r typecheck

  drift-check:
    # vendored packages must not drift from the monorepo
    runs-on: ubuntu-latest
    continue-on-error: true # non-blocking until MONOREPO_PAT secret is added
    steps:
      - uses: actions/checkout@v4
        with: { repository: entryagents/entry-agents, path: mono, token: ${{ secrets.MONOREPO_PAT }} }
      - uses: actions/checkout@v4
        with: { path: desktop }
      - name: Compare vendored packages
        run: |
          fail=0
          for p in agent sandbox shared tsconfig; do
            if ! diff -rq "mono/packages/$p" "desktop/packages/$p" >/dev/null 2>&1; then
              echo "::error::packages/$p drifted from the monorepo — run scripts/sync-packages.sh"
              fail=1
            fi
          done
          exit $fail
